# CI del repositorio: typecheck + lint + tests unitarios (PGlite en memoria, sin red), build de
# producción, auditoría de dependencias y comprobación de que las páginas web generadas coinciden
# con sus fuentes. Los tests de integración (*.it.test.ts) no se ejecutan aquí: publican en relays
# reales y llaman a una TSA y a un calendario OpenTimestamps.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm audit --prod --audit-level=high
      # Las páginas de web/ y el panel incrustado se generan desde sus fuentes: si alguien edita el
      # HTML generado a mano, o cambia una fuente sin regenerar, este paso lo detecta.
      - name: web build reproducible
        run: |
          node web/build.mjs
          git diff --exit-code -- web src/infra/http/panel.html
